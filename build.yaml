# GitHub Actions build matrix for the consolidated config.
# One entry per board/shield half, plus a settings_reset build per hardware.
---
include:
  # --- TOTEM (xiao_ble split) ---
  - board: xiao_ble//zmk
    shield: totem_left
  - board: xiao_ble//zmk
    shield: totem_right
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: totem_settings_reset

  # --- cb34s (nice_nano_v2 + nice!view) ---
  - board: nice_nano_v2
    shield: cb34s nice_view_adapter nice_view
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: cb34s_settings_reset
