# GitHub Actions build matrix for the consolidated config.
# One entry per board/shield half, plus a settings_reset build per hardware.
# Every real board pulls the common settings via EXTRA_CONF_FILE=config/shared.conf
# (in addition to any board-specific config/<board>.conf). settings_reset builds
# deliberately omit it — they only wipe stored settings.
---
include:
  # --- TOTEM (xiao_ble split) ---
  - board: xiao_ble//zmk
    shield: totem_left
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared.conf
  - board: xiao_ble//zmk
    shield: totem_right
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared.conf
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: totem_settings_reset

  # --- cb34s (nice!nano v2 + animated nice!view via nice-view-gem) ---
  # ZMK boards now need the //zmk variant (Zephyr 4.1 hardware model), and the
  # old nice_nano_v2 board is now `nice_nano` (defaults to the 2.0.0 revision).
  - board: nice_nano//zmk
    shield: cb34s nice_view_adapter nice_view_gem
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared.conf
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: nrf_settings_reset

  # --- Urchin (nice!nano v2; hardware from the duckyb/urchin-zmk-module module) ---
  # With the animated nice!view custom screen (nice-view-gem).
  - board: nice_nano//zmk
    shield: urchin_left nice_view_adapter nice_view_gem
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared.conf
  - board: nice_nano//zmk
    shield: urchin_right nice_view_adapter nice_view_gem
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared.conf

  # --- re-gret (xiao_ble unibody; hardware from rschenk/zmk-keyboard-re-gret) ---
  - board: xiao_ble//zmk
    shield: re-gret
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared.conf

  # --- forager (xiao_ble split; hardware from carrefinho/forager-zmk-module) ---
  # Built bare; the forager RGB LED status widget is a later opt-in.
  - board: xiao_ble//zmk
    shield: forager_left
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared.conf
  - board: xiao_ble//zmk
    shield: forager_right
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared.conf

  # --- delta-omega (xiao_ble split; hardware from unspecworks/zmk-keyboard-delta-omega) ---
  - board: xiao_ble//zmk
    shield: delta_omega_left
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared.conf
  - board: xiao_ble//zmk
    shield: delta_omega_right
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared.conf

  # --- Cornholius (ebastler wireless nRF52840 unibody, drop-in PCB for the Foostan
  # Cornelius). The upstream module (ebastler/zmk-module-cornholius) still ships the
  # board in the old Zephyr HWv1 layout and pins zmk v0.3, so instead of a module we
  # vendor a HWv2-migrated copy under boards/ebastler/cornholius/ (board_root is set
  # in zephyr/module.yml) — builds against our unified zmk main, no pinning. Superset
  # with a full 4th row (48 keys); outer column + 4th-row outers + outer thumbs map to
  # reserved master slots (currently inactive), so it runs the canonical 34-key core. ---
  - board: cornholius//zmk
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared.conf
  - board: cornholius//zmk
    shield: settings_reset
    artifact-name: cornholius_settings_reset

  # --- corne_ul (nice!nano; standard foostan Corne shield, built into ZMK core) ---
  # First superset (3x6+3); outer column + 3rd thumb map to reserved master slots
  # (currently inactive). No module/vendoring needed.
  - board: nice_nano//zmk
    shield: corne_left
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared.conf
  - board: nice_nano//zmk
    shield: corne_right
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared.conf

  # --- KLOTZ (GEIGEIGEIST split, nice!nano; vendored shield in boards/shields/klotz).
  # Pure 3x5+2 core plus one rotary encoder per half (EC11, enabled by the shield's
  # klotz.conf). Built bare — no backlight/underglow. ---
  - board: nice_nano//zmk
    shield: klotz_left
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared.conf
  - board: nice_nano//zmk
    shield: klotz_right
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared.conf
