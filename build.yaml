# GitHub Actions build matrix for the consolidated config.
# One entry per board/shield half, plus a settings_reset build per hardware.
# Every real board pulls the common settings via EXTRA_CONF_FILE=config/shared_ble.conf
# (in addition to any board-specific config/<board>.conf). settings_reset builds
# deliberately omit it — they only wipe stored settings.
---
include:
  # --- TOTEM (xiao_ble split) ---
  - board: xiao_ble//zmk
    shield: totem_left
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf
  - board: xiao_ble//zmk
    shield: totem_right
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: totem_settings_reset

  # --- cb34s (nice!nano v2 + animated nice!view via nice-view-gem) ---
  # ZMK boards now need the //zmk variant (Zephyr 4.1 hardware model), and the
  # old nice_nano_v2 board is now `nice_nano` (defaults to the 2.0.0 revision).
  - board: nice_nano//zmk
    shield: cb34s nice_view_adapter nice_view_gem
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: nrf_settings_reset

  # --- Urchin (nice!nano v2; hardware from the duckyb/urchin-zmk-module module) ---
  # With the animated nice!view custom screen (nice-view-gem).
  - board: nice_nano//zmk
    shield: urchin_left nice_view_adapter nice_view_gem
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf
  - board: nice_nano//zmk
    shield: urchin_right nice_view_adapter nice_view_gem
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf

  # --- re-gret (xiao_ble unibody; hardware from rschenk/zmk-keyboard-re-gret) ---
  - board: xiao_ble//zmk
    shield: re-gret
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf

  # --- forager (xiao_ble split; hardware from carrefinho/forager-zmk-module) ---
  # Built bare; the forager RGB LED status widget is a later opt-in.
  - board: xiao_ble//zmk
    shield: forager_left
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf
  - board: xiao_ble//zmk
    shield: forager_right
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf

  # --- delta-omega (xiao_ble split; hardware from unspecworks/zmk-keyboard-delta-omega) ---
  - board: xiao_ble//zmk
    shield: delta_omega_left
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf
  - board: xiao_ble//zmk
    shield: delta_omega_right
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf

  # --- Cornholius (ebastler wireless nRF52840 unibody, drop-in PCB for the Foostan
  # Cornelius). The upstream module (ebastler/zmk-module-cornholius) still ships the
  # board in the old Zephyr HWv1 layout and pins zmk v0.3, so instead of a module we
  # vendor a HWv2-migrated copy under boards/shields/cornholius/ (board_root is set
  # in zephyr/module.yml) — builds against our unified zmk main, no pinning. Superset
  # with a full 4th row (48 keys); outer column + 4th-row modifiers active, outer
  # thumbs reserved. ---
  - board: cornholius//zmk
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf
  - board: cornholius//zmk
    shield: settings_reset
    artifact-name: cornholius_settings_reset

  # --- corne_ul (nice!nano; standard foostan Corne shield, built into ZMK core) ---
  # First superset (3x6+3); outer column + 3rd thumb map to reserved master slots
  # (currently inactive). No module/vendoring needed.
  - board: nice_nano//zmk
    shield: corne_left
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf
  - board: nice_nano//zmk
    shield: corne_right
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf

  # --- KLOTZ (GEIGEIGEIST split, nice!nano; vendored shield in boards/shields/klotz).
  # Pure 3x5+2 core plus one rotary encoder per half (EC11, enabled by the shield's
  # klotz.conf). Built bare — no backlight/underglow. ---
  - board: nice_nano//zmk
    shield: klotz_left
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf
  - board: nice_nano//zmk
    shield: klotz_right
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf

  # --- Splaytoraid40 (wired RP2040 unibody; vendored shield in boards/shields/
  # splaytoraid40). USB only (no BLE) -> uses config/shared_usb.conf instead of the
  # BLE shared_ble.conf. The encoder's EC11 comes from the shield's own
  # splaytoraid40.conf. Outer column (top+home) + center encoder. ---
  - board: sparkfun_pro_micro_rp2040//zmk
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_usb.conf
    shield: splaytoraid40

  # --- Splaytoraid36 (BLE nice!nano; vendored shield in boards/shields/splaytoraid36).
  # The Splaytoraid40 without the outer pinky column: 3x5 core + 3 thumbs/hand +
  # center encoder. Wireless -> shared_ble.conf; EC11 from the shield's own conf. ---
  - board: nice_nano//zmk
    shield: splaytoraid36
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf

  # --- sweep (Ferris Sweep; cradio_left/right shields built into ZMK core) ---
  - board: nice_nano//zmk
    shield: cradio_left
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf
  - board: nice_nano//zmk
    shield: cradio_right
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf

  # --- El Chibre (BLE nice!nano unibody; vendored shield in boards/shields/elchibre).
  # Plain 3x5 + 2 thumbs/hand, contiguous 0..33 -> reuses geom_3x5_2.h. ---
  - board: nice_nano//zmk
    shield: elchibre
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf

  # --- MNHTTN (fooker split on xiao_ble; vendored shield in boards/shields/mnhttn).
  # 3x5 core + 3 thumbs/hand. ---
  - board: xiao_ble//zmk
    shield: mnhttn_left
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf
  - board: xiao_ble//zmk
    shield: mnhttn_right
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf

  # --- Onyx Cinder (eggsworks "le oeuf" unibody on xiao_ble; vendored shield in
  # boards/shields/onyxcinder). 3x5 core + 3 thumbs/hand; rows driven by a 595 shift
  # register over SPI (enabled by the shield's Kconfig.defconfig). If your Onyx
  # Cinder is the wired RP2040 build instead, switch to seeeduino_xiao_rp2040//zmk
  # + shared_usb.conf. ---
  - board: xiao_ble//zmk
    shield: onyxcinder
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf

  # --- Le Chiffre BLE ("BLE Chiffre", MangoIV) — vendored HWv2 nRF52840 unibody
  # board in boards/shields/le_chiffre_ble/ (migrated from the HWv1 board in
  # zmk-config-chiffre). 3x5 core + center key (Mute) + 2 thumbs/hand + center
  # encoder. OLED display off for now. ---
  - board: le_chiffre_ble//zmk
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf
  - board: le_chiffre_ble//zmk
    shield: settings_reset
    artifact-name: le_chiffre_ble_settings_reset

  # --- Le Chiffre 36 (chiffre36) — vendored HWv2 STM32F072 board in
  # boards/shields/le_chiffre_stm32/ (migrated from zmk-config-chiffre36). USB only
  # (STM32, no BLE) -> shared_usb.conf. 3x5 core + 3 thumbs/hand (36-key transform). ---
  - board: le_chiffre_stm32//zmk
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_usb.conf

  # --- Endgame (unibody, vendored shield in boards/shields/endgame). Two build
  # variants off ONE shield + ONE thin config/endgame.keymap; 3x5 core + 3 thumbs/
  # hand (geom_3x5_3.h). The shield needs a pro_micro footprint.
  #   BLEndgame — the BLE variant on nice!nano (nRF52840) -> shared_ble.conf.
  #   endgame   — the wired RP2040 (Gemini/RP2040-Zero class) variant on a pro_micro
  #               RP2040 controller -> shared_usb.conf (no radio). ---
  - board: nice_nano//zmk
    shield: endgame
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_ble.conf
    artifact-name: blendgame
  - board: sparkfun_pro_micro_rp2040//zmk
    shield: endgame
    cmake-args: -DEXTRA_CONF_FILE=../../config/shared_usb.conf
    artifact-name: endgame
