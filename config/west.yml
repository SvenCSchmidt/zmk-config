manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    # Single, unified ZMK revision for every board in this repo.
    # The current vertical slice (TOTEM on xiao_ble, cb34s on nice_nano_v2) is
    # all nRF-based and builds against zmk main. When the ARM/STM32 boards
    # (Le Chiffre) are migrated, re-check that this revision still builds them
    # before adding them to build.yaml.
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
  self:
    path: config
