manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: duckyb
      url-base: https://github.com/duckyb
    - name: m165437
      url-base: https://github.com/M165437
    - name: rschenk
      url-base: https://github.com/rschenk
    - name: carrefinho
      url-base: https://github.com/carrefinho
    - name: unspecworks
      url-base: https://github.com/unspecworks
  projects:
    # Single, unified ZMK revision for every board in this repo.
    # The current boards (TOTEM on xiao_ble, cb34s + Urchin on nice_nano) are all
    # nRF-based and build against zmk main. When the ARM/STM32 boards (Le Chiffre)
    # are migrated, re-check that this revision still builds them before adding them.
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # Urchin hardware definition (shield). Provided as an upstream ZMK module rather
    # than copied into boards/. The Urchin firmware repo pins zmk v0.3.0, but this
    # module already uses zmk,physical-layout; if it fails to build against zmk main,
    # pin this revision to a main-compatible commit.
    - name: urchin-zmk-module
      remote: duckyb
      revision: main
    # Animated nice!view custom status screen (used by cb34s and Urchin).
    # Its main branch tracks zmk main / Zephyr 4.1, matching our zmk revision.
    - name: nice-view-gem
      remote: m165437
      revision: main
    # re-gret unibody keyboard shield (module). Pinned to its v0.4 tag, which the
    # author updated for the ZMK v0.4 / Zephyr 4.1 breaking changes (our zmk main).
    - name: zmk-keyboard-re-gret
      remote: rschenk
      revision: v0.4
    # forager split keyboard shield (module). Tracks zmk main.
    - name: forager-zmk-module
      remote: carrefinho
      revision: main
    # delta-omega split keyboard shield (module). Targets zmk main.
    - name: zmk-keyboard-delta-omega
      remote: unspecworks
      revision: main
  self:
    path: config
