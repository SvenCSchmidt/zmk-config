# cb34s — board-specific overrides only. Common settings come from shared.conf.
# cb34s builds with a nice!view display, so it carries the display widget config.

# --- DISPLAY (nice!view) ---
CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
