# Tipper TF board-specific config. The 1.54" GoodDisplay GDEW0154M09 (JD79653
# controller) epaper is driven by the out-of-tree driver vendored in
# drivers/display/ (registered via zephyr/module.yml). Radio/debounce/combo
# settings come from config/shared_ble.conf.

# Turn on the ZMK display pipeline + the vendored JD79653 driver
CONFIG_ZMK_DISPLAY=y
CONFIG_JD79653=y

# The panel needs a heap for the LVGL display buffers
CONFIG_HEAP_MEM_POOL_SIZE=4096
