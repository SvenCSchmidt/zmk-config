# shared_usb.conf — common settings for WIRED / USB-only boards (RP2040 "pro micro"
# clones such as Helios/SparkFun). These boards have no Bluetooth radio, so this file
# deliberately omits everything BLE (see shared_ble.conf for the wireless variant).
# Applied via -DEXTRA_CONF_FILE=../../config/shared_usb.conf in build.yaml.
#
# Board-specific settings/overrides live in the (otherwise omitted) per-board
# config/<board>.conf or the shield's own <shield>.conf (e.g. an encoder's EC11).

# USB is the (only) output on these boards
CONFIG_ZMK_USB=y

# "Eager Debouncing" — trying to lower the input lag
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# combo limits — the shared config uses many, sometimes overlapping, combos
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=16
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=5
