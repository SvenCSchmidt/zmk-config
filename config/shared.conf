# shared.conf — common settings for every board (the single source of truth for
# board config, modelled on the canonical TOTEM options). Applied to each build
# via `-DEXTRA_CONF_FILE=../../config/shared.conf` in build.yaml.
#
# Board-specific settings/overrides live in the (otherwise omitted) per-board
# config/<board>.conf, which is loaded in addition to this file.

# enable bluetooth
CONFIG_BT=y
# increase bluetooth signal power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# enable deep sleep support; disconnect after 30 minutes idle
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# tune bluetooth profiles for quick select
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# "Eager Debouncing" — trying to lower the input lag
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# combo limits — the shared config uses many, sometimes overlapping, combos
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=16
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=5

# experimental BLE features (as used by TOTEM)
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# report peripheral battery level on split boards (no-op on unibody boards)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
