# Urchin — board-specific overrides only. Common settings come from shared.conf.
# Animated nice!view custom status screen via the nice-view-gem module.

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# animated gem screen (set =n to save battery)
CONFIG_NICE_VIEW_GEM_ANIMATION=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
