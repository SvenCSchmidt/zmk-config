# Splaytoraid40 — wired RP2040 unibody: USB only, NO Bluetooth. It deliberately does
# NOT use the BLE-centric config/shared.conf (that would enable CONFIG_BT on a board
# with no radio). This file (auto-applied by ZMK for shield "splaytoraid40") carries
# the hardware-agnostic bits it still needs.

CONFIG_ZMK_USB=y

# combo limits — the shared config uses many, sometimes overlapping, combos
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=16
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=5

# "Eager Debouncing" — lower the input lag
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# rotary encoder (center)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
